name: release

# Two release-please lanes share this workflow.
#
#   beta lane   (.github/prerelease-*.json) keeps "chore: release vX.Y.Z-beta.N" open whenever master
#               has releasable commits. Merging it tags and publishes a pre-release.
#   stable lane (.github/release-*.json) runs right after a beta tag and opens "chore: release
#               vX.Y.Z". Merging the stable PR graduates: the beta lane recognises it by the shared
#               pull-request-title-pattern and tags the stable version on the next run.
#
# So the only manual step in either lane is merging a PR. The stable lane's extra-files write the
# graduated version back into the beta manifest, which restarts the beta counter from the new base.
#
# Nothing is tagged or published unless the test lane is green.

on:
  push:
    branches: [master]

permissions:
  contents: read

# Two pushes close together would otherwise race to create the same release PR.
concurrency:
  group: release
  cancel-in-progress: false

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"

jobs:
  tests:
    name: Native tests (release gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, fetch-depth: 0 }
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-native-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-native-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-
      - name: Bootstrap vcpkg
        run: ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Configure
        run: cmake --preset clang-x64-tests
      - name: Build
        run: cmake --build --preset clang-x64-tests
      - name: Test
        run: ctest --preset clang-x64-tests --output-on-failure

  beta:
    name: Maintain the prerelease PR
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      # Both lanes run as a GitHub App. PRs authored by github-actions[bot] leave their CI runs parked
      # awaiting a manual approval click, which the app identity is exempt from.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/prerelease-config.json
          manifest-file: .github/prerelease-manifest.json

  graduate:
    name: Open the stable release PR
    needs: beta
    if: needs.beta.outputs.released == 'true' && contains(needs.beta.outputs.tag, '-beta.')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      # PR only. The beta lane owns tagging and adopts this PR once it is merged, so letting this run
      # cut releases too would tag the same version twice.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .github/release-config.json
          manifest-file: .github/release-manifest.json
          skip-github-release: true

  build-linux:
    name: Build mod (Linux x86_64, Frida)
    needs: beta
    if: needs.beta.outputs.released == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, fetch-depth: 0 }
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build
      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-linux-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-
      - name: Bootstrap vcpkg
        run: ./external/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - name: Configure
        run: cmake --preset clang-x64-release
      - name: Check the build picked up the release tag
        run: |
          built=$(cat build/clang-x64-release/version.txt)
          want="${TAG#v}"
          if [ "$built" != "$want" ]; then
            echo "::error::drop-in stamped $built but the release is $want"
            exit 1
          fi
        env:
          TAG: ${{ needs.beta.outputs.tag }}
      - name: Build
        run: cmake --build --preset clang-x64-release
      - name: Upload mod drop-in (Linux)
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: build/clang-x64-release/mods/
          if-no-files-found: error

  build-windows:
    name: Build mod (Windows clang-cl x64)
    needs: beta
    if: needs.beta.outputs.released == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with: { submodules: recursive, fetch-depth: 0 }
      - name: Set up MSVC environment (x64)
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64
      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-winclangcl-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-winclangcl-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-
      - name: Bootstrap vcpkg
        shell: cmd
        run: external\vcpkg\bootstrap-vcpkg.bat -disableMetrics
      - name: Configure
        run: cmake --preset clang-cl-x64-release
      - name: Check the build picked up the release tag
        shell: bash
        run: |
          built=$(cat build/clang-cl-x64-release/version.txt)
          want="${TAG#v}"
          if [ "$built" != "$want" ]; then
            echo "::error::drop-in stamped $built but the release is $want"
            exit 1
          fi
        env:
          TAG: ${{ needs.beta.outputs.tag }}
      - name: Build
        run: cmake --build --preset clang-cl-x64-release
      - name: Upload mod drop-in (Windows)
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: build/clang-cl-x64-release/mods/
          if-no-files-found: error

  publish:
    name: Attach the drop-ins to the release
    needs: [beta, build-linux, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      # Each artifact extracts to dist/<name>/apclient/ (the binary, mod.yc and the licence files); re-zip per platform
      # so the release asset unpacks to an apclient/ drop-in folder.
      - name: Package drop-in zips
        env:
          TAG: ${{ needs.beta.outputs.tag }}
        run: |
          ( cd dist/release-linux && zip -r "$GITHUB_WORKSPACE/mth-apclient-${TAG}-linux.zip" apclient )
          ( cd dist/release-windows && zip -r "$GITHUB_WORKSPACE/mth-apclient-${TAG}-windows.zip" apclient )
      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # this job has no checkout; tell gh the repo
          TAG: ${{ needs.beta.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            "mth-apclient-${TAG}-linux.zip" \
            "mth-apclient-${TAG}-windows.zip" --clobber
          # Set both flags explicitly from the tag. The beta lane is what tags a graduated stable
          # release too, and it runs with prerelease:true, so without this a stable release would ship
          # flagged as a pre-release and never become "latest".
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --prerelease=true --latest=false
          else
            gh release edit "$TAG" --prerelease=false --latest=true
          fi

      - name: Derive the Nexus version and changelog
        id: ver
        if: ${{ !contains(needs.beta.outputs.tag, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.beta.outputs.tag }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          # The release body is release-please's changelog section for this version, so Nexus gets the
          # same notes as the GitHub release rather than a second hand-written copy.
          {
            echo "notes<<NEXUS_NOTES_EOF"
            gh release view "$TAG" --json body -q .body
            echo "NEXUS_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # Both Nexus steps are skipped for the beta lane, which tags and publishes here too. A dash in
      # the tag is what separates v1.2.0-beta.3 from v1.2.0.
      #
      # file_id is the mod-file id from the Files tab's API info panel, NOT the small file_id in the
      # download URL. That one is a game-scoped version id and would point at another mod's file.
      # Nexus renamed update groups to mod files in June 2026 and the site still labels it a group id.
      - name: Crosspost the Linux drop-in to Nexus Mods
        if: ${{ !contains(needs.beta.outputs.tag, '-') }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_ID_LINUX }}
          filename: mth-apclient-${{ needs.beta.outputs.tag }}-linux.zip
          display_name: APClient Linux
          version: ${{ steps.ver.outputs.version }}
          archive_existing_version: true

      - name: Crosspost the Windows drop-in to Nexus Mods
        if: ${{ !contains(needs.beta.outputs.tag, '-') }}
        uses: Nexus-Mods/upload-action@v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_ID_WINDOWS }}
          filename: mth-apclient-${{ needs.beta.outputs.tag }}-windows.zip
          display_name: APClient Windows
          version: ${{ steps.ver.outputs.version }}
          archive_existing_version: true
          # The page version and the changelog belong to the mod, not to either archive, so only the
          # last upload sets them.
          update_mod_version: true
          mod_id: ${{ vars.NEXUS_MOD_ID }}
          changelog: ${{ steps.ver.outputs.notes }}
